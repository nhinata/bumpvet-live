# Experiment for nhinata/bumpvet#37: how a check run from an approving review
# shows on a pull request, and what a pull request's token can read. Removed
# after the experiment.
name: accept-experiment
on:
  pull_request:
  pull_request_review:
    types: [submitted, edited, dismissed]
permissions:
  contents: read
  pull-requests: read
jobs:
  accept:
    runs-on: ubuntu-latest
    steps:
      - name: Look for an approving review that accepts
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "event=$EVENT action=$ACTION GITHUB_SHA=$GITHUB_SHA head=$HEAD_SHA actor=$GITHUB_ACTOR"
          gh api --paginate "repos/$REPO/pulls/$PR/reviews" \
            -q '.[] | [.user.login, .state, .author_association, .commit_id, ((.body // "") | split("\n") | map(select(startswith("bumpvet: accept "))) | join(" | "))] | @tsv' \
            > reviews.tsv
          cat reviews.tsv
          ok=0
          while IFS=$'\t' read -r user state assoc commit accepts; do
            [[ "$state" == APPROVED && -n "$accepts" ]] || continue
            if perm=$(gh api "repos/$REPO/collaborators/$user/permission" -q .permission 2>&1); then
              echo "permission of $user: $perm"
              [[ "$perm" == admin || "$perm" == write ]] && ok=1
            else
              echo "permission of $user could not be read: $perm"
            fi
          done < reviews.tsv
          if [[ $ok == 1 ]]; then echo "accepted"; else echo "::error::no accepting approval"; exit 1; fi
